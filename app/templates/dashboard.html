{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Dashboard</h1>
<div class="grid grid-cols-3 gap-4">
  <div class="bg-white p-6 rounded shadow"><div class="text-gray-500">Customers</div><div class="text-3xl font-bold">{{ stats.customers }}</div></div>
  <div class="bg-white p-6 rounded shadow"><div class="text-gray-500">Orders</div><div class="text-3xl font-bold">{{ stats.orders }}</div></div>
  <div class="bg-white p-6 rounded shadow"><div class="text-gray-500">Completed revenue</div><div class="text-3xl font-bold">₹{{ "%.0f"|format(stats.revenue) }}</div></div>
</div>
{% endblock %}
