{% extends "base.html" %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Customers</h1>
<form class="mb-4"><input name="q" value="{{ q }}" placeholder="Search name or email" class="border rounded px-3 py-2 w-72">
  <button class="bg-indigo-700 text-white px-4 py-2 rounded">Search</button></form>
<table class="w-full bg-white rounded shadow text-left">
  <tr class="border-b font-semibold"><th class="p-3">Name</th><th>Email</th><th>City</th><th>Orders</th><th>Spent</th></tr>
  {% for c in customers %}
  <tr class="border-b hover:bg-gray-50">
    <td class="p-3"><a class="text-indigo-700 underline" href="/customers/{{ c.id }}">{{ c.first_name }} {{ c.last_name }}</a></td><td>{{ c.email }}</td><td>{{ c.city }}</td>
    <td>{{ c.orders|length }}</td><td>₹{{ "%.0f"|format(c.orders|sum(attribute='total')) }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
